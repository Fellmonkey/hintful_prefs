name: hintful_prefs
description: shared_preferences-backed persistent store for hintful — show a hint or tour once per app version, out of the box.
version: 1.0.0
repository: https://github.com/Fellmonkey/hintful_prefs
topics:
  - flutter
  - onboarding
  - tooltip
  - coach-marks
  - shared-preferences
environment:
  # Floor follows `hintful` (which needs Flutter 3.16 for textScalerOf) and
  # shared_preferences ^2.3.0.
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  hintful: ^1.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
