name: hintful_prefs_example
description: "Minimal demo of SharedPreferencesHintStore — a hint or tour shown once per app version."
publish_to: 'none'
version: 1.0.0

environment:
  # Same floor as hintful_prefs 2.x.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # The package under demonstration — through the public barrel.
  hintful_prefs:
    path: ../
  hintful: ^2.0.0
  material_ui: ^1.11.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
