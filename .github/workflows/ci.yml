name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.47.0', '3.50.0']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.sdk }}
          channel: stable
          cache: true
      # Resolution comes from pub.dev, so `hintful: ^2.0.0` must be published
      # before this job can go green.
      - name: Analyze + test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Publish dry-run
        run: flutter pub publish --dry-run
