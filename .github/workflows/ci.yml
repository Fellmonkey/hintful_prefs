name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Resolution comes from pub.dev, so `hintful: ^1.0.0` must be published
      # for this job to go green.
      - name: Analyze + test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Publish dry-run
        run: flutter pub publish --dry-run
